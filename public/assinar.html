<!DOCTYPE html>
<html>
  <head>
    <title>Assinar Documento</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family: Arial;
        text-align: center;
        background-color: #f0f5ff;
        padding: 20px;
      }
      #quadroAssinatura {
        border: 2px dashed #0055ff;
        background: #ffffff;
        cursor: crosshair;
        margin: 20px auto;
        display: block;
        border-radius: 10px;
      }
      button {
        padding: 15px 30px;
        font-size: 18px;
        cursor: pointer;
        background-color: #0055ff;
        color: white;
        border: none;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <h2>2. Assine abaixo</h2>
    <p>Use o dedo (no celular) ou o mouse (no PC)</p>

    <canvas id="quadroAssinatura" width="300" height="150"></canvas>

    <button onclick="enviarAssinatura()">Confirmar Assinatura</button>
    <div id="resultado" style="margin-top: 20px; font-weight: bold"></div>

    <script>
      const canvas = document.getElementById('quadroAssinatura');
      const ctx = canvas.getContext('2d');
      let desenhando = false;

      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#000000';

      // Eventos Mouse
      canvas.addEventListener('mousedown', (e) => {
        desenhando = true;
        ctx.beginPath();
        ctx.moveTo(e.offsetX, e.offsetY);
      });
      canvas.addEventListener('mousemove', (e) => {
        if (desenhando) {
          ctx.lineTo(e.offsetX, e.offsetY);
          ctx.stroke();
        }
      });
      canvas.addEventListener('mouseup', () => (desenhando = false));

      // Eventos Celular (Toque)
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        desenhando = true;
        const rect = canvas.getBoundingClientRect();
        ctx.beginPath();
        ctx.moveTo(
          e.touches[0].clientX - rect.left,
          e.touches[0].clientY - rect.top
        );
      });
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (desenhando) {
          const rect = canvas.getBoundingClientRect();
          ctx.lineTo(
            e.touches[0].clientX - rect.left,
            e.touches[0].clientY - rect.top
          );
          ctx.stroke();
        }
      });
      canvas.addEventListener('touchend', () => (desenhando = false));

      async function enviarAssinatura() {
        const assinaturaBase64 = canvas.toDataURL('image/png');
        document.getElementById('resultado').innerHTML = 'Gerando PDF...';

        const resposta = await fetch('/assinar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ assinaturaBase64 }),
        });
        const dados = await resposta.json();

        document.getElementById('resultado').innerHTML = `
                <p style="color: green;">${dados.message}</p>
                <a href="${dados.link}" download="documento_assinado.pdf" style="font-size: 20px;">📥 Baixar PDF Assinado</a>
            `;
      }
    </script>
  </body>
</html>
